[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-transaction-risk"
version = "1.0.0"
description = "Rule based AML transaction monitoring and customer risk scoring over synthetic data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Amruta Lopes" }]
keywords = ["aml", "fraud-detection", "risk-scoring", "pandas", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aml-risk = "aml.cli:main"

[project.urls]
Repository = "https://github.com/AmrutaLopes/AML-Transaction-Risk-Analytics"

[tool.setuptools]
packages = ["aml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
